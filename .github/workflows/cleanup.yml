name: Clean up workflow runs

on:
    schedule:
        - cron: '17 3 * * 1'
    workflow_dispatch:

permissions: {}

jobs:
    cleanup:
        name: Delete runs older than a week
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            # Uses this repository's own token, which has its own hourly API allowance, so the owner's personal allowance
            # is never touched. GitHub deletes runs one call at a time; the cap keeps a large backlog within that
            # allowance, and the rest goes on the next run. Runs still in progress are left alone.
            - name: Delete completed runs older than a week
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  cutoff="$(date -u -d '7 days ago' +%Y-%m-%d)"
                  gh api --paginate "repos/$REPOSITORY/actions/runs?per_page=100&created=<$cutoff" \
                      --jq '.workflow_runs[] | select(.status == "completed") | .id' \
                      | head -n 900 \
                      | while read -r run_id; do
                          gh api --method DELETE "repos/$REPOSITORY/actions/runs/$run_id" --silent
                      done
